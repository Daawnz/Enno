name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GitHub-hosted runners are dedicated VMs: the e2e suite boots several
    # Chromium instances with the MV3 extension loaded, and needs CPU headroom
    # to meet its per-test budget (see E2E-FLAKINESS-ANALYSIS.md, rec 8).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: E2E tests
        run: bun run test:e2e
